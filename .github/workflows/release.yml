name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

env:
  GO_VERSION: "1.25"

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the tag is available

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all platform binaries
        run: |
          mkdir -p dist
          declare -A targets=(
            ["linux-amd64"]="linux/amd64"
            ["linux-arm64"]="linux/arm64"
            ["darwin-amd64"]="darwin/amd64"
            ["darwin-arm64"]="darwin/arm64"
          )
          for name in "${!targets[@]}"; do
            IFS='/' read -r goos goarch <<< "${targets[$name]}"
            echo "Building sshelf-${name}..."
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath \
                -ldflags="-s -w -X github.com/ajf1016/sshelf/internal/config.AppVersion=${GITHUB_REF_NAME}" \
                -o dist/sshelf-${name} \
                ./cmd/sshelf
          done
          ls -lh dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum sshelf-* > checksums.txt && cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Install

            **macOS (Apple Silicon)**
            ```bash
            curl -Lo sshelf https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sshelf-darwin-arm64
            chmod +x sshelf && sudo mv sshelf /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -Lo sshelf https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sshelf-darwin-amd64
            chmod +x sshelf && sudo mv sshelf /usr/local/bin/
            ```

            **Linux (x86_64)**
            ```bash
            curl -Lo sshelf https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sshelf-linux-amd64
            chmod +x sshelf && sudo mv sshelf /usr/local/bin/
            ```

            **go install**
            ```bash
            go install github.com/${{ github.repository }}/cmd/sshelf@${{ github.ref_name }}
            ```

            See [README](https://github.com/${{ github.repository }}#installation) for full install instructions.

            ## Checksums
            Verify your download against `checksums.txt` attached below.
          files: |
            dist/sshelf-linux-amd64
            dist/sshelf-linux-arm64
            dist/sshelf-darwin-amd64
            dist/sshelf-darwin-arm64
            dist/checksums.txt
          draft: false
          prerelease: false

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Compute source tarball SHA256
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ajf1016/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          FORMULA="homebrew-tap/Formula/sshelf.rb"
          sed -i "s|url \".*archive/refs/tags/.*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" "$FORMULA"

      - name: Commit and push formula update
        working-directory: homebrew-tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sshelf.rb
          git commit -m "sshelf ${{ github.ref_name }}"
          git push
